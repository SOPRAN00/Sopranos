<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sopranos Journal</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%22503%2054%2084%20105%22%3E%3Cpath%20d%3D%22M545%2058%20L583%2071%20V111%20Q583%20141%20545%20155%20Q507%20141%20507%20111%20V71%20Z%22%20fill%3D%22%23120c20%22%20stroke%3D%22%238b5cf6%22%20stroke-width%3D%225%22/%3E%3Ctext%20x%3D%22545%22%20y%3D%22120%22%20text-anchor%3D%22middle%22%20font-size%3D%2252%22%20font-weight%3D%22700%22%20font-family%3D%22Georgia%2Cserif%22%20fill%3D%22%23c084fc%22%3ES%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#07050c;--card:#100c1a;--card2:#161024;--bd:#2a1f45;--tx:#ece8f7;--mu:#8d82aa;--pu:#8b5cf6;--pu2:#c084fc;--win:#34d399;--loss:#f43f5e}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(900px 500px at 85% -10%,#2a1058 0,transparent 60%),radial-gradient(700px 400px at -10% 110%,#1d0b3d 0,transparent 60%),var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
#fx{will-change:transform;position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header,main{position:relative;z-index:1}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:16px 20px;max-width:1150px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.2px}
.logo .mk{width:30px;height:auto;flex:none;filter:drop-shadow(0 0 8px #8b5cf655)}
.logo small{color:var(--mu);font-weight:500;font-size:12px;display:block;margin-top:-2px}
main{max-width:1150px;margin:0 auto;padding:0 20px 40px}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;transition:.18s}
button{cursor:pointer}button:hover{border-color:var(--pu);box-shadow:0 0 0 3px #8b5cf622}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pu);box-shadow:0 0 0 3px #8b5cf633}
.pri{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border-color:transparent;font-weight:600}
.ghost{background:transparent}
.card{background:linear-gradient(180deg,rgba(22,16,36,.95),rgba(16,12,26,.97));border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:16px;animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin-bottom:16px}
.stat{background:linear-gradient(180deg,rgba(22,16,36,.9),rgba(16,12,26,.92));border:1px solid var(--bd);border-radius:14px;padding:12px 14px}
.stat span{color:var(--mu);font-size:12px}.stat b{display:block;font-size:21px;margin-top:2px;font-variant-numeric:tabular-nums}
.w{color:var(--win)}.l{color:var(--loss)}.mu{color:var(--mu)}
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.top h2{margin:0;font-size:20px;min-width:170px}
.top .sp{flex:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(78px,.9fr);gap:6px}
.dh{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.8px;text-align:center;padding:4px 0}
.day{min-height:84px;border-radius:12px;border:1px solid var(--bd);padding:7px 8px;cursor:pointer;position:relative;background:#0d0916;transition:.18s;display:flex;flex-direction:column;justify-content:space-between}
.day:hover{transform:translateY(-2px);border-color:var(--pu2);box-shadow:0 6px 20px #8b5cf62e}
.day.out{opacity:.25;pointer-events:none}
.day.sel{border-color:var(--pu2);box-shadow:0 0 0 2px #c084fc55}
.day.today .n{background:var(--pu);color:#fff;border-radius:6px;padding:0 6px}
.day.win{background:linear-gradient(160deg,rgba(52,211,153,calc(.08 + var(--a)*.35)),#0d0916 85%);border-color:rgba(52,211,153,.35)}
.day.loss{background:linear-gradient(160deg,rgba(244,63,94,calc(.08 + var(--a)*.35)),#0d0916 85%);border-color:rgba(244,63,94,.35)}
.n{font-size:12px;color:var(--mu);align-self:flex-start}
.p{font-weight:700;font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.c{font-size:10.5px;color:var(--mu);text-align:right}
.wk{border-radius:12px;border:1px dashed var(--bd);padding:7px 8px;display:flex;flex-direction:column;justify-content:space-between;background:#120c20}
.wk .n{text-transform:uppercase;letter-spacing:.6px;font-size:10px}
.tbl{width:100%;border-collapse:collapse}.tbl td,.tbl th{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px}.tbl th{color:var(--mu);font-weight:500;font-size:12px}
.scroll{overflow-x:auto}.tbl{min-width:560px}
.tag{font-size:11px;border:1px solid var(--bd);border-radius:99px;padding:2px 9px;color:var(--pu2);background:#8b5cf611;white-space:nowrap}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.hd h3{margin:0;font-size:16px}
textarea{width:100%;min-height:72px;resize:vertical}
canvas{width:100%;display:block}
dialog{border:1px solid var(--bd);border-radius:18px;background:var(--card);color:var(--tx);padding:20px;width:min(560px,94vw);max-height:92vh;box-shadow:0 30px 80px #000c}
dialog::backdrop{background:#000c}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.g label{display:flex;flex-direction:column;gap:4px;color:var(--mu);font-size:12px}
.g input,.g select{width:100%}
.empty{text-align:center;color:var(--mu);padding:22px}
/* pictures */
.addpic{display:inline-block;cursor:pointer;background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;transition:.18s}
.addpic:hover{border-color:var(--pu);box-shadow:0 0 0 3px #8b5cf622}
.pics{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.th{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--bd);background:#0d0916}
.th img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.th button{position:absolute;top:2px;right:2px;padding:0 6px;line-height:18px;font-size:12px;border-radius:99px;background:#000b}
.th.big{width:96px;height:96px}
.lb{position:fixed;inset:0;z-index:100;background:#000e;display:grid;place-items:center;cursor:zoom-out}
.lb img{max-width:94vw;max-height:90vh;border-radius:12px;box-shadow:0 20px 60px #000}
@media(max-width:700px){main,header{padding-left:10px;padding-right:10px}.day{min-height:62px;padding:5px}.p{font-size:11px}.c{display:none}.cal{gap:4px;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(54px,.9fr)}.wk .n{font-size:8px}}
.moon{position:fixed;top:5%;right:6%;width:min(38vw,400px);aspect-ratio:1;border-radius:50%;z-index:0;pointer-events:none;opacity:.55;
background:
radial-gradient(circle at 30% 35%,rgba(120,100,170,.35) 0 7%,transparent 8%),
radial-gradient(circle at 62% 28%,rgba(120,100,170,.3) 0 10%,transparent 11%),
radial-gradient(circle at 55% 66%,rgba(120,100,170,.35) 0 12%,transparent 13%),
radial-gradient(circle at 25% 70%,rgba(120,100,170,.25) 0 6%,transparent 7%),
radial-gradient(circle at 35% 30%,#f6f1ff 0,#d3c4f5 40%,#9a86cf 75%,#6a54a8 100%);
box-shadow:0 0 60px 10px #8b5cf666,0 0 220px 70px #8b5cf62a}
@keyframes moon{from{box-shadow:0 0 60px 10px #8b5cf655,0 0 200px 60px #8b5cf622}to{box-shadow:0 0 80px 16px #8b5cf688,0 0 260px 90px #8b5cf633}}
@media(max-width:700px){.moon{width:62vw;top:3%;right:-12%;opacity:.4}}
/* ---- little dark house with smoke (click = refresh) ---- */
.house{position:fixed;top:0;left:6px;width:112px;z-index:2;cursor:pointer;overflow:visible;transition:.2s;-webkit-tap-highlight-color:transparent}
.house:hover{filter:drop-shadow(0 0 10px #8b5cf6aa);transform:translateY(2px)}
.house .sm{fill:#b9a9e6;opacity:0;will-change:transform,opacity;transform-box:fill-box;transform-origin:center;animation:smoke 6s linear infinite;pointer-events:none}
@keyframes smoke{0%{opacity:0;transform:translate(0,0) scale(.5)}12%{opacity:.5}100%{opacity:0;transform:translate(26px,-86px) scale(3.4)}}
.house .win{animation:flick 3.2s ease-in-out infinite alternate}
@keyframes flick{from{opacity:.65}to{opacity:1}}
@media(max-width:1380px){header{padding-left:120px}}
@media(max-width:700px){.house{width:72px;left:2px}header{padding-left:78px}}
@media(prefers-reduced-motion:reduce){.house .sm,.house .win{animation:none}.house .sm{opacity:.25}}
/* ---- Discord login ---- */
#auth{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;background:rgba(7,5,12,.25);animation:in .5s ease both}
#auth .box{width:min(380px,100%);text-align:center;padding:34px 28px 26px;border-radius:22px;border:1px solid var(--bd);background:linear-gradient(180deg,rgba(22,16,36,.82),rgba(16,12,26,.9));backdrop-filter:blur(10px);box-shadow:0 30px 80px #000a,0 0 60px #8b5cf622}
body:has(#auth) header,body:has(#auth) main,body:has(#auth) .house,body:has(#auth) #bt,body:has(#auth) #bp{display:none}
#auth .join,.joinh{display:block;text-decoration:none;color:var(--pu2);border:1px solid var(--bd);border-radius:12px;padding:10px 20px;margin-top:10px;font-weight:600;font-size:13px;transition:.18s}
#auth .join:hover,.joinh:hover{border-color:var(--pu);box-shadow:0 0 0 3px #8b5cf622}
.joinh{display:inline-block;margin:0;padding:8px 14px;font-weight:600;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;border-color:transparent;white-space:nowrap}
.joinh:hover{border-color:transparent;box-shadow:0 0 0 3px #8b5cf655}
.dcard{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dcard b{font-size:15px}.dcard p{margin:2px 0 0;color:var(--mu);font-size:13px}
#auth .lg{width:64px;margin:0 auto 14px}#auth .mk2{width:64px;height:auto;display:block;filter:drop-shadow(0 0 14px #8b5cf688)}
#auth h2{margin:0;font-size:26px;letter-spacing:.3px}
#auth .tag2{color:var(--pu2);font-size:13px;margin:4px 0 18px}
#auth ul{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:8px;text-align:left}
#auth li{font-size:13px;color:var(--mu);padding:8px 12px;border:1px solid var(--bd);border-radius:10px;background:#0d0916}
#auth button{width:100%;background:#5865f2;border:0;font-weight:600;padding:12px 20px;border-radius:12px}
#auth button:hover{box-shadow:0 0 0 3px #5865f244,0 8px 24px #5865f255}
#auth button:disabled{opacity:.6;cursor:wait}
#auth .fine{font-size:11px;color:var(--mu);margin:14px 0 0}
.me{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mu)}
.me img{width:26px;height:26px;border-radius:50%}
.hr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* ---- ICT chat bot ---- */
#bt{position:fixed;right:16px;bottom:16px;z-index:60;box-shadow:0 8px 30px #8b5cf655}
#bp{position:fixed;right:16px;bottom:64px;z-index:60;width:min(380px,calc(100vw - 32px));height:min(520px,70vh);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;box-shadow:0 20px 60px #000c}
#bp[hidden]{display:none}
#bp .bh{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--bd);background:var(--card2)}
#bm{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bmsg{max-width:88%;padding:8px 11px;border-radius:12px;font-size:13px;line-height:1.5;word-wrap:break-word}
.bmsg.user{align-self:flex-end;background:linear-gradient(135deg,#8b5cf6,#6d28d9)}
.bmsg.bot{align-self:flex-start;background:var(--card2);border:1px solid var(--bd)}
#bf{display:flex;gap:8px;padding:10px;border-top:1px solid var(--bd)}
#bf input{flex:1;min-width:0}
/* ---- mobile ---- */
html{-webkit-text-size-adjust:100%}
@media(max-width:700px){
 input,select,textarea{font-size:16px}
 button{min-height:40px}
 header{padding-top:10px;padding-bottom:8px;gap:8px}
 .logo{font-size:16px}
 .hr{gap:6px;width:100%;justify-content:flex-end}
 .me span,.me{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .joinh{padding:8px 10px;font-size:13px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .stat{padding:10px 12px}.stat b{font-size:18px}
 .card{padding:12px;border-radius:14px}
 .top{gap:6px}
 .top h2{min-width:0;flex:1;text-align:center;font-size:17px}
 .top .sp{display:none}
 #msum{width:100%;text-align:center}
 .dh{font-size:10px;letter-spacing:.3px}
 .day{border-radius:9px}
 .n{font-size:11px}
 dialog{width:96vw;padding:14px;border-radius:14px}
 .g{grid-template-columns:repeat(2,minmax(0,1fr))}
 .th.big{width:78px;height:78px}
 #bt{right:10px;bottom:10px}
 #bp{right:8px;bottom:58px;width:calc(100vw - 16px);height:min(520px,68dvh)}
 #auth{padding:14px}
 #auth .box{padding:26px 18px 20px;border-radius:18px}
 #auth h2{font-size:22px}
}
@media(max-width:380px){.g{grid-template-columns:1fr}.p{font-size:10px}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}.chip{font-size:12px;padding:4px 10px;border-radius:99px;background:transparent;color:var(--pu2)}
/* ---- background music button ---- */
#mu{position:fixed;left:16px;bottom:16px;z-index:60;box-shadow:0 8px 30px #8b5cf655;background:var(--card2)}
body:has(#auth) #mu{display:none}
@media(max-width:700px){#mu{left:10px;bottom:10px}}
</style></head><body>
<div class="moon" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<svg class="house" id="house" viewBox="0 0 140 150" role="button" aria-label="Refresh page"><title>Refresh</title>
 <circle class="sm" cx="77" cy="74" r="4" style="animation-delay:0s"/>
 <circle class="sm" cx="77" cy="74" r="4" style="animation-delay:1.5s"/>
 <circle class="sm" cx="77" cy="74" r="4" style="animation-delay:3s"/>
 <circle class="sm" cx="77" cy="74" r="4" style="animation-delay:4.5s"/>
 <rect x="72" y="76" width="10" height="26" fill="#150e26" stroke="#2a1f45" stroke-width="1.5"/>
 <rect x="70" y="73" width="14" height="5" rx="1" fill="#1a1230" stroke="#2a1f45" stroke-width="1.5"/>
 <rect x="24" y="104" width="64" height="40" fill="#120c20" stroke="#2a1f45" stroke-width="1.5"/>
 <polygon points="16,106 56,70 96,106" fill="#0d0916" stroke="#3a2a63" stroke-width="1.5" stroke-linejoin="round"/>
 <rect class="win" x="34" y="116" width="13" height="13" rx="1.5" fill="#c084fc" opacity=".85"/>
 <path d="M40.5 116v13M34 122.5h13" stroke="#120c20" stroke-width="1.2"/>
 <rect x="62" y="120" width="15" height="24" rx="1.5" fill="#07050c" stroke="#2a1f45" stroke-width="1.2"/>
 <circle cx="74" cy="133" r="1" fill="#8b5cf6"/>
</svg>
<header><div class="logo"><svg class="mk" viewBox="503 54 84 105" role="img" aria-label="Sopranos Journal"><path d="M545 58 L583 71 V111 Q583 141 545 155 Q507 141 507 111 V71 Z" fill="#120c20" stroke="#8b5cf6" stroke-width="3.5"/><text x="545" y="118" text-anchor="middle" font-size="44" font-weight="700" style="font-family:Georgia,'Times New Roman',serif" fill="#c084fc">S</text><polyline points="525,141 535,135 543,139 556,127" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><div>Sopranos Journal<small>USD</small></div></div>
<div class="hr">
  <div class="me" id="me"></div>
  <button class="ghost" id="out">Logout</button>
  <button class="pri" id="add">+ New trade</button>
</div></header>
<main>
<div class="stats" id="stats"></div>
<div class="card">
 <div class="top"><button class="ghost" id="pv">‹</button><h2 id="mt"></h2><button class="ghost" id="nx">›</button><button class="ghost" id="td">Today</button><span class="sp"></span><span id="msum" style="font-weight:700;font-size:16px"></span></div>
 <div class="cal" id="cal"></div>
</div>
<div class="card" id="dp"></div>
<div class="card"><div class="hd"><h3>Equity curve</h3><span class="mu" id="eqs"></span></div><canvas id="eq" height="190"></canvas></div>
<div class="card dcard"><div><b>Join our Discord community</b><p>Share trades, ask questions and learn with other traders.</p></div><a class="joinh" href="https://discord.gg/TwmU6kC42E" target="_blank" rel="noopener">Join server</a></div>
</main>
<dialog id="dlg"><form method="dialog" id="fm">
 <div class="hd"><h3 id="dt">New trade</h3><button type="button" class="ghost" id="x">✕</button></div>
 <div class="g">
  <label>Date<input type="date" id="fd" required=""></label><label>Time<input type="time" id="ft"></label>
  <label>Symbol<input id="fs" value="USTEC.f"></label>
  <label>Side<select id="fsd"><option>Long</option><option>Short</option></select></label>
  <label>Entry<input type="number" step="any" id="fe"></label><label>Exit<input type="number" step="any" id="fx2"></label>

 </div>
 <label class="mu" style="display:block;margin:10px 0 4px;font-size:12px">Notes</label><textarea id="fn" placeholder="Why this trade? What went right or wrong?"></textarea>

a:"**ICT** stands for Inner Circle Trader, a trading approach taught by Michael Huddleston. It focuses on how price moves from one pool of liquidity to another, using ideas like market structure, liquidity, fair value gaps, order blocks, and time of day (killzones). It is a discretionary method, so how you read the chart matters a lot."},
{k:["market structure shift","mss","choch","change of character","change in character","reversal signal"],
a:"**MSS (Market Structure Shift)**, also called **CHoCH (Change of Character)**, is the first break of structure against the current trend. In an uptrend, price breaks below the last higher low. ICT teaches the best MSS comes with **displacement** (a strong, fast move that leaves FVGs) and often right after a liquidity sweep. It is an early reversal clue, not a guarantee."},
{k:["break of structure","bos","trend continuation"],
a:"**BOS (Break of Structure)**: price breaks beyond the previous swing high (in an uptrend) or swing low (in a downtrend), ideally with a candle body close past it. It confirms the trend is continuing. Example: in an uptrend price takes out the last swing high, so the bias stays bullish and you look to buy pullbacks into a discount PD array."},
{k:["market structure","swing high","swing low","higher high","lower low","hh hl","trend structure"],
a:"**Market structure** is the sequence of swing highs and lows. An uptrend makes higher highs (HH) and higher lows (HL); a downtrend makes lower highs (LH) and lower lows (LL). ICT traders mark swing points, then watch for a **BOS** (continuation) or an **MSS/CHoCH** (possible reversal). Start on a higher timeframe for direction, then drop down for entries."},
{k:["liquidity sweep","sweep","stop hunt","raid","liquidity raid","liquidity grab","fake breakout"],
a:"A **liquidity sweep** (also called a raid or stop hunt) is when price pokes past a high or low to trigger resting stops, then reverses. A useful sweep usually shows a wick beyond the level, a close back inside, then an MSS with displacement. If price keeps closing beyond the level, it is more likely a real breakout than a sweep."},
{k:["draw on liquidity","dol","daily bias","bias","directional bias","which direction"],
a:"**Daily bias** is your expected direction for the day. A common process: **1)** read higher timeframe structure (weekly/daily). **2)** find the **draw on liquidity**, like a prior day/week high or low or an unfilled HTF FVG. **3)** check whether price is in premium or discount. **4)** see how price reacted to HTF PD arrays. Then trade only in that direction during killzones. If bias is unclear, skipping the day is fine."},
{k:["buy side liquidity","sell side liquidity","bsl","ssl","liquidity","equal highs","equal lows","liquidity pool","old high","old low"],
a:"**Liquidity** is where lots of orders (mostly stop losses) are sitting. **Buy-side liquidity (BSL)** rests above highs (stops of shorts plus breakout buy orders). **Sell-side liquidity (SSL)** rests below lows. Common pools: equal highs/lows, previous day/week highs and lows, and session highs/lows like the Asian range. The idea is that price is drawn to these levels and often reverses after taking them."},
{k:["inversion fvg","ifvg","bpr","balanced price range","inverse fvg","inversion"],
a:"An **Inversion FVG (IFVG)** happens when price closes through an FVG instead of respecting it, so the gap flips role: a broken bullish FVG can become resistance, a broken bearish FVG can become support. A **BPR (Balanced Price Range)** is where a bullish and a bearish FVG overlap, and price often reacts there."},
{k:["fair value gap","fvg","fvgs","imbalance","consequent encroachment","gap fill","bisi","sibi","inefficiency"],
a:"A **Fair Value Gap (FVG)** is a three-candle pattern where the middle candle's strong move leaves a gap between the high of candle 1 and the low of candle 3 (bullish), or the low of candle 1 and the high of candle 3 (bearish). Price often returns to fill part of it. Many traders watch the 50% midpoint, called **consequent encroachment (CE)**. Bullish FVGs tend to act as support in uptrends and bearish FVGs as resistance in downtrends."},
{k:["breaker block","breaker","mitigation block","mitigation"],
a:"A **Breaker Block** is an order block that failed: price broke through it (usually after sweeping liquidity), and now it flips. A failed bullish OB becomes a **bearish breaker** that can act as resistance on a retest, and vice versa. A **Mitigation Block** is similar, but price does not take liquidity first before the structure shift. Both are retest entries after a reversal."},
{k:["order block","orderblock","ob","obs","bullish ob","bearish ob"],
a:"An **Order Block (OB)** is the last opposing candle before a strong displacement move. A **bullish OB** is the last down candle before price rallies and breaks structure; a **bearish OB** is the last up candle before a strong drop. Traders watch the candle body or its 50% level as an entry zone on the retrace. Stronger OBs form after a liquidity sweep, cause an MSS, and leave an FVG. The stop usually goes beyond the OB's extreme."},
{k:["optimal trade entry","ote","62","79","70.5","fibonacci","fib retracement","fib"],
a:"**OTE (Optimal Trade Entry)** is the retracement zone between **62% and 79%** of a swing leg, with 70.5% as the sweet spot. After an MSS, draw a Fibonacci from the swing low to high (or high to low for sells) and look for an FVG or OB inside that zone for the entry. Put the stop beyond the swing and target the opposite liquidity."},
{k:["premium","discount","equilibrium","dealing range","premium and discount","premium discount","50%"],
a:"ICT splits a dealing range (swing low to swing high) at its **50% equilibrium**. Above 50% is **premium** (expensive: look to sell). Below 50% is **discount** (cheap: look to buy). With a bullish bias you want to buy from discount PD arrays; with a bearish bias, sell from premium. Buying in premium while bullish is usually considered lower quality."},
{k:["pd array","pd arrays","price delivery array"],
a:"**PD Arrays (Premium/Discount Arrays)** are the price levels ICT uses as reaction zones: order blocks, FVGs, breakers, mitigation blocks, rejection blocks, old highs and lows, and so on. Bullish setups use discount arrays, bearish setups use premium arrays. Higher timeframe arrays carry more weight than lower timeframe ones."},
{k:["displacement","energetic move","impulsive move","impulse"],
a:"**Displacement** is a strong, fast, one-sided move made of large-bodied candles that usually leaves FVGs behind. It shows aggressive participation and is what makes a structure break credible. A break without displacement is more likely a fake-out."},
{k:["silver bullet"],
a:"The **Silver Bullet** is a time-based setup taught in one-hour windows (New York time): about 3:00-4:00 AM, 10:00-11:00 AM, and 2:00-3:00 PM. Inside the window, look for a liquidity sweep or MSS, then an FVG, enter on the retrace into it, and target the next liquidity level. It is mainly used on index futures like NQ, and only makes sense if there is enough room to the target."},
{k:["killzone","kill zone","killzones","session","london open","new york open","ny open","trading hours","best time","what time"],
a:"**Killzones** are the high-volume times ICT traders focus on (New York time): Asian ~8:00 PM-12:00 AM, London ~2:00-5:00 AM, New York AM ~7:00-10:00 AM, London close ~10:00 AM-12:00 PM. Exact windows differ slightly by teacher. Many traders only trade London and NY AM. Convert these to your own local timezone before using them."},
{k:["judas swing","judas"],
a:"A **Judas Swing** is a false move at a session open (like the New York midnight open or the London open) that sweeps liquidity one way before price reverses and runs the other way. Wait for the sweep plus an MSS instead of chasing the first move."},
{k:["power of 3","power of three","po3","amd","accumulation manipulation distribution","accumulation"],
a:"**Power of 3 (PO3 / AMD)** stands for Accumulation, Manipulation, Distribution. Price consolidates (accumulation, often the Asian session), makes a false move to grab liquidity (manipulation, the Judas swing), then moves in the true direction (distribution, London/NY). On a daily candle, a bullish PO3 opens, drops below the open, then rallies to close above it."},
{k:["asian range","asia range","asian session","asia session"],
a:"The **Asian range** is the high and low formed in the Asian session (~8 PM-12 AM ET). London often sweeps one side of it (the Judas swing) before moving the other way, so its high and low act as liquidity targets. Mark the range before London opens."},
{k:["smt","smt divergence","smart money tool","divergence","correlated","correlation"],
a:"**SMT Divergence (Smart Money Tool)** compares correlated markets, like NQ vs ES vs YM, or EURUSD vs GBPUSD vs DXY. If one market makes a new high/low and the other fails to, that disagreement hints at weakness at that level and a possible reversal. It works best at key liquidity levels or inside killzones as extra confirmation, not on its own."},
{k:["midnight open","true day open","opening gap","ndog","nwog","new york midnight","opening price","8:30","830"],
a:"The **New York midnight open (00:00 ET)** and the **8:30 AM open** are reference prices. With a bullish bias you want to buy below the open (discount); with a bearish bias, sell above it (premium). **Opening gaps (NDOG/NWOG)** are the gap between the prior close and the new open, and their 50% level often acts as support or resistance."},
{k:["ipda","interbank price delivery","20 40 60","lookback"],
a:"**IPDA (Interbank Price Delivery Algorithm)** is ICT's idea that price is delivered algorithmically, referencing the last 20, 40, and 60 days of highs and lows as liquidity targets. In practice, it means marking old highs/lows from those lookback windows as potential draws on liquidity. It is a theory you cannot verify, so treat it as a framework."},
{k:["entry model","how to enter","how do i enter","how to trade","trade plan","strategy","step by step","setup","model","how to use ict","start"],
a:"A typical ICT entry flow: **1)** set higher timeframe bias (daily/4H). **2)** wait for a killzone. **3)** look for a liquidity sweep of a high/low. **4)** wait for displacement and an MSS. **5)** enter on the retrace into an FVG/OB (ideally inside OTE, in discount for buys or premium for sells). **6)** stop beyond the swept extreme or the OB. **7)** target the next opposing liquidity, aiming for at least 2R. Practice on demo first and log each trade in your journal."},
{k:["timeframe","time frame","which timeframe","higher timeframe","htf","ltf","1 minute","5 minute","15 minute"],
a:"A common approach: use **weekly/daily/4H** for bias and key levels, **1H/15m** for structure and PD arrays, and **5m/1m** to time the entry. Always keep higher timeframe context above lower timeframe signals."},
{k:["stop loss","take profit","target","where to put stop","where to place stop","sl","tp","breakeven"],
a:"**Stops** go beyond the swing high/low that was swept, or beyond the OB/FVG extreme (the level that proves your idea wrong). **Targets** are the next liquidity pool (previous high/low, equal highs/lows, session extremes) or an opposite-side PD array. Taking partials at 1R-2R and moving to breakeven are common choices, but define your rules and test them."},
{k:["risk","risk management","position size","lot size","risk reward","rr","drawdown","money management","daily loss"],
a:"Risk basics: risk a small fixed % per trade (many use 0.5-1%), place stops where your idea is invalid, look for at least 1:2 reward-to-risk, set a max daily loss, and stop trading after hitting it. Never move a stop further away. If you cannot define the stop, you do not have a trade. This is education, not financial advice."},
{k:["journal","journaling","psychology","emotion","mood","discipline","revenge","fomo","overtrading"],
a:"Use your journal's **Setup** field for the model (e.g. 'Silver Bullet', 'OB + FVG', 'MSS retrace') and the **Mood** field to spot emotional trades like FOMO or revenge. After 20-30 trades, compare setups by win rate and profit factor, and write a daily reflection. Chart screenshots make review much easier."},
{k:["profitable","does ict work","is ict good","legit","scam","does it work","win rate","proven"],
a:"Honest answer: ICT concepts are discretionary and subjective, so two traders can mark the same chart differently. There is no solid public evidence that it is profitable for most traders, and most retail traders lose money in general. Treat it as a framework, backtest your own rules, use a demo account first, and keep risk small."},
{k:["hi","hello","hey","help","topics","menu","yo","sup"],
a:"Hey! I can explain ICT concepts. Try asking about: market structure, BOS, MSS/CHoCH, liquidity, sweeps, FVG, order blocks, breaker blocks, premium/discount, OTE, killzones, Silver Bullet, Power of 3, Judas swing, SMT divergence, daily bias, entry model, or risk management."}
];

const norm=s=>" "+s.toLowerCase().replace(/[^a-z0-9.%: ]+/g," ").replace(/\s+/g," ")+" ";
function answer(q){const t=norm(q);let best=null,bs=0;
 for(const e of KB){let s=0;for(const k of e.k){const hit=k.length<=4?t.includes(" "+k+" "):t.includes(k);if(hit)s+=k.length}
  if(s>bs){bs=s;best=e}}
 return best?best.a:FALLBACK}
const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>");
function addM(role,text){const d=document.createElement("div");d.className="bmsg "+role;d.innerHTML=fmt(text);$("#bm").appendChild(d);$("#bm").scrollTop=1e9;return d}

const CHIPS=["Market structure","Liquidity","FVG","Order blocks","Killzones","Silver Bullet","Entry model","Risk management"];

 const c=document.createElement("div");c.className="chips";
 CHIPS.forEach(x=>{const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=x;b.onclick=()=>ask(x);c.appendChild(b)});
 $("#bm").appendChild(c)}
$("#bt").onclick=()=>{const p=$("#bp");p.hidden=!p.hidden;if(!p.hidden){if(!$("#bm").children.length)greet();$("#bi").focus()}};
$("#bx").onclick=()=>{$("#bp").hidden=true};
$("#bf").onsubmit=e=>{e.preventDefault();const q=$("#bi").value.trim();if(!q)return;$("#bi").value="";ask(q)};

<script>
/* ---- background music: play/pause button, remembers choice ---- */
(function(){
  const a=document.getElementById("bgm"), b=document.getElementById("mu");
  a.volume=0.3;
  const get=()=>{try{return localStorage.getItem("music")}catch(e){return null}};
  const set=v=>{try{localStorage.setItem("music",v)}catch(e){}};
  const ui=()=>{b.textContent=a.paused?"🔇 Music off":"🔊 Music on"};
  a.addEventListener("play",ui); a.addEventListener("pause",ui);

  b.addEventListener("click",()=>{
    if(a.paused){a.play().catch(()=>{});set("on")}
    else{a.pause();set("off")}
  });

  // If they had music on last visit, resume on their first tap/click anywhere
  if(get()==="on"){
    const resume=e=>{
      if(e.target.closest("#mu"))return;
      a.play().catch(()=>{});
      removeEventListener("pointerdown",resume);
    };
    addEventListener("pointerdown",resume);
  }
})();
</script>
