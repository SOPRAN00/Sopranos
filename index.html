<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Sopranos</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#07050c;--card:#100c1a;--card2:#161024;--bd:#2a1f45;--tx:#ece8f7;--mu:#8d82aa;--pu:#8b5cf6;--pu2:#c084fc;--win:#34d399;--loss:#f43f5e}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(900px 500px at 85% -10%,#2a1058 0,transparent 60%),radial-gradient(700px 400px at -10% 110%,#1d0b3d 0,transparent 60%),var(--bg);background-attachment:fixed;color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header,main{position:relative;z-index:1}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:16px 20px;max-width:1150px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.2px}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--pu),#4c1d95);box-shadow:0 0 20px #8b5cf655;display:grid;place-items:center;font-style:normal;font-size:15px}
.logo small{color:var(--mu);font-weight:500;font-size:12px;display:block;margin-top:-2px}
main{max-width:1150px;margin:0 auto;padding:0 20px 40px}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;transition:.18s}
button{cursor:pointer}button:hover{border-color:var(--pu);box-shadow:0 0 0 3px #8b5cf622}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pu);box-shadow:0 0 0 3px #8b5cf633}
.pri{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border-color:transparent;font-weight:600}
.ghost{background:transparent}
.card{background:linear-gradient(180deg,rgba(22,16,36,.9),rgba(16,12,26,.92));border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:16px;animation:in .45s ease both;backdrop-filter:blur(6px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin-bottom:16px}
.stat{background:linear-gradient(180deg,rgba(22,16,36,.9),rgba(16,12,26,.92));border:1px solid var(--bd);border-radius:14px;padding:12px 14px;animation:in .45s ease both;backdrop-filter:blur(6px)}
.stat span{color:var(--mu);font-size:12px}.stat b{display:block;font-size:21px;margin-top:2px;font-variant-numeric:tabular-nums}
.w{color:var(--win)}.l{color:var(--loss)}.mu{color:var(--mu)}
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.top h2{margin:0;font-size:20px;min-width:170px}
.top .sp{flex:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(78px,.9fr);gap:6px}
.dh{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.8px;text-align:center;padding:4px 0}
.day{min-height:84px;border-radius:12px;border:1px solid var(--bd);padding:7px 8px;cursor:pointer;position:relative;background:#0d0916;transition:.18s;display:flex;flex-direction:column;justify-content:space-between}
.day:hover{transform:translateY(-2px);border-color:var(--pu2);box-shadow:0 6px 20px #8b5cf62e}
.day.out{opacity:.25;pointer-events:none}
.day.sel{border-color:var(--pu2);box-shadow:0 0 0 2px #c084fc55}
.day.today .n{background:var(--pu);color:#fff;border-radius:6px;padding:0 6px}
.day.win{background:linear-gradient(160deg,rgba(52,211,153,calc(.08 + var(--a)*.35)),#0d0916 85%);border-color:rgba(52,211,153,.35)}
.day.loss{background:linear-gradient(160deg,rgba(244,63,94,calc(.08 + var(--a)*.35)),#0d0916 85%);border-color:rgba(244,63,94,.35)}
.n{font-size:12px;color:var(--mu);align-self:flex-start}
.p{font-weight:700;font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.c{font-size:10.5px;color:var(--mu);text-align:right}
.wk{border-radius:12px;border:1px dashed var(--bd);padding:7px 8px;display:flex;flex-direction:column;justify-content:space-between;background:#120c20}
.wk .n{text-transform:uppercase;letter-spacing:.6px;font-size:10px}
.tbl{width:100%;border-collapse:collapse}.tbl td,.tbl th{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px}.tbl th{color:var(--mu);font-weight:500;font-size:12px}
.scroll{overflow-x:auto}.tbl{min-width:560px}
.tag{font-size:11px;border:1px solid var(--bd);border-radius:99px;padding:2px 9px;color:var(--pu2);background:#8b5cf611;white-space:nowrap}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.hd h3{margin:0;font-size:16px}
textarea{width:100%;min-height:72px;resize:vertical}
canvas{width:100%;display:block}
dialog{border:1px solid var(--bd);border-radius:18px;background:var(--card);color:var(--tx);padding:20px;width:min(560px,94vw);max-height:92vh;box-shadow:0 30px 80px #000c}
dialog::backdrop{background:#000a;backdrop-filter:blur(4px)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.g label{display:flex;flex-direction:column;gap:4px;color:var(--mu);font-size:12px}
.g input,.g select{width:100%}
.empty{text-align:center;color:var(--mu);padding:22px}
/* pictures */
.addpic{display:inline-block;cursor:pointer;background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;transition:.18s}
.addpic:hover{border-color:var(--pu);box-shadow:0 0 0 3px #8b5cf622}
.pics{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.th{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--bd);background:#0d0916}
.th img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.th button{position:absolute;top:2px;right:2px;padding:0 6px;line-height:18px;font-size:12px;border-radius:99px;background:#000b}
.th.big{width:96px;height:96px}
.lb{position:fixed;inset:0;z-index:100;background:#000d;display:grid;place-items:center;cursor:zoom-out;backdrop-filter:blur(4px)}
.lb img{max-width:94vw;max-height:90vh;border-radius:12px;box-shadow:0 20px 60px #000}
@media(max-width:700px){main,header{padding-left:10px;padding-right:10px}.day{min-height:62px;padding:5px}.p{font-size:11px}.c{display:none}.cal{gap:4px;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(54px,.9fr)}.wk .n{font-size:8px}}
.moon{position:fixed;top:5%;right:6%;width:min(38vw,400px);aspect-ratio:1;border-radius:50%;z-index:0;pointer-events:none;opacity:.55;
background:
radial-gradient(circle at 30% 35%,rgba(120,100,170,.35) 0 7%,transparent 8%),
radial-gradient(circle at 62% 28%,rgba(120,100,170,.3) 0 10%,transparent 11%),
radial-gradient(circle at 55% 66%,rgba(120,100,170,.35) 0 12%,transparent 13%),
radial-gradient(circle at 25% 70%,rgba(120,100,170,.25) 0 6%,transparent 7%),
radial-gradient(circle at 35% 30%,#f6f1ff 0,#d3c4f5 40%,#9a86cf 75%,#6a54a8 100%);
box-shadow:0 0 60px 10px #8b5cf666,0 0 220px 70px #8b5cf62a;animation:moon 8s ease-in-out infinite alternate}
@keyframes moon{from{box-shadow:0 0 60px 10px #8b5cf655,0 0 200px 60px #8b5cf622}to{box-shadow:0 0 80px 16px #8b5cf688,0 0 260px 90px #8b5cf633}}
@media(max-width:700px){.moon{width:62vw;top:3%;right:-12%;opacity:.4}}
@media(prefers-reduced-motion:reduce){.moon{animation:none}}
/* ---- little dark house with smoke (click = refresh) ---- */
.house{position:fixed;top:0;left:6px;width:112px;z-index:2;cursor:pointer;overflow:visible;transition:.2s;-webkit-tap-highlight-color:transparent}
.house:hover{filter:drop-shadow(0 0 10px #8b5cf6aa);transform:translateY(2px)}
.house .sm{fill:#b9a9e6;opacity:0;transform-box:fill-box;transform-origin:center;animation:smoke 6s linear infinite;pointer-events:none}
@keyframes smoke{0%{opacity:0;transform:translate(0,0) scale(.5)}12%{opacity:.5}100%{opacity:0;transform:translate(26px,-86px) scale(3.4)}}
.house .win{animation:flick 3.2s ease-in-out infinite alternate}
@keyframes flick{from{opacity:.65}to{opacity:1}}
@media(max-width:1380px){header{padding-left:120px}}
@media(max-width:700px){.house{width:72px;left:2px}header{padding-left:78px}}
@media(prefers-reduced-motion:reduce){.house .sm,.house .win{animation:none}.house .sm{opacity:.25}}
/* ---- Discord login ---- */
#auth{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--bg)}
#auth .box{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:32px;text-align:center;max-width:340px}
#auth .box h2{margin:0 0 8px}
#auth button{background:#5865f2;border:0;font-weight:600;padding:10px 20px;margin-top:14px}
.me{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mu)}
.me img{width:26px;height:26px;border-radius:50%}
.hr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style></head><body>

<!-- ===== Discord login (runs first) ===== -->
<script>
const DISCORD_CLIENT_ID="1565095062499627188";
const REDIRECT="https://zuro98.github.io/Sopranos/";
let USER=null;
try{USER=JSON.parse(localStorage.getItem("jUser")||"null")}catch(e){}
if(USER&&USER.exp<Date.now())USER=null;

function loginUrl(){
  const s=crypto.randomUUID();sessionStorage.setItem("oauthState",s);
  return "https://discord.com/oauth2/authorize?"+new URLSearchParams({
    client_id:DISCORD_CLIENT_ID,response_type:"token",redirect_uri:REDIRECT,scope:"identify",state:s});
}
function showLogin(msg){
  const old=document.getElementById("auth");if(old)old.remove();
  document.body.insertAdjacentHTML("beforeend",
   `<div id="auth"><div class="box"><h2>Sopranos Journal</h2>
    <p class="mu">${msg||"Sign in with Discord to continue."}</p>
    <button onclick="location.href=loginUrl()">Continue with Discord</button></div></div>`);
}
(async()=>{
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get("access_token")){
    const ok=h.get("state")===sessionStorage.getItem("oauthState");
    history.replaceState(null,"",location.pathname);
    if(!ok)return showLogin("Login failed (bad state). Try again.");
    try{
      const r=await fetch("https://discord.com/api/users/@me",{headers:{Authorization:"Bearer "+h.get("access_token")}});
      const u=await r.json();
      if(!u.id)throw 0;
      localStorage.setItem("jUser",JSON.stringify({id:u.id,name:u.global_name||u.username,avatar:u.avatar,exp:Date.now()+(+h.get("expires_in")||604800)*1000}));
      location.reload();
    }catch(e){showLogin("Couldn't reach Discord. Try again.")}
  }else if(!USER)showLogin();
})();
</script>

<script>
if(!USER)throw new Error("login required");
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,"0");
/* house = refresh */
$("#house").onclick=()=>location.reload();
/* ---- moving flames (purple, matches theme) ---- */
const fc=$("#fx"),fg=fc.getContext("2d");let FW=0,FH=0,P=[];
function fr(){const d=devicePixelRatio||1;FW=innerWidth;FH=innerHeight;fc.width=FW*d;fc.height=FH*d;fg.setTransform(d,0,0,d,0,0)}
fr();addEventListener("resize",fr);
function flames(){
 fg.clearRect(0,0,FW,FH);fg.globalCompositeOperation="lighter";
 const base=fg.createLinearGradient(0,FH-140,0,FH);base.addColorStop(0,"rgba(139,92,246,0)");base.addColorStop(1,"rgba(139,92,246,.14)");
 fg.fillStyle=base;fg.fillRect(0,FH-140,FW,140);
 const want=Math.min(260,Math.max(80,FW/5));
 for(let i=0;i<4&&P.length<want;i++)P.push({x:Math.random()*FW,y:FH+20,r:28+Math.random()*48,vy:1+Math.random()*2.2,l:0,m:110+Math.random()*120,ph:Math.random()*6.28,sp:.02+Math.random()*.03});
 P=P.filter(p=>p.l<p.m);
 for(const p of P){
  p.l++;const t=p.l/p.m;p.y-=p.vy;p.x+=Math.sin(p.l*p.sp+p.ph)*1.1;
  const r=p.r*(1-t*.75),a=(1-t)*.1*(t<.1?t*10:1),h=290-t*35,li=68-t*36;
  const g=fg.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
  g.addColorStop(0,`hsla(${h},90%,${li}%,${a})`);g.addColorStop(1,`hsla(${h},90%,${li}%,0)`);
  fg.fillStyle=g;fg.beginPath();fg.arc(p.x,p.y,r,0,6.283);fg.fill()}
 fg.globalCompositeOperation="source-over";requestAnimationFrame(flames)}
if(!matchMedia("(prefers-reduced-motion: reduce)").matches)flames();
/* ---- journal ---- */
let T=[],N={},now=new Date(),Y=now.getFullYear(),M=now.getMonth(),sel=null,eid=null,manual=false,pics=[];
const KT="jT:"+USER.id,KN="jN:"+USER.id;
try{
  // one-time migration of existing local data to the first account that logs in
  if(!localStorage.getItem(KT)&&localStorage.getItem("jT")){localStorage.setItem(KT,localStorage.getItem("jT"));localStorage.setItem(KN,localStorage.getItem("jN")||"{}");localStorage.removeItem("jT");localStorage.removeItem("jN")}
  T=JSON.parse(localStorage.getItem(KT)||"[]");N=JSON.parse(localStorage.getItem(KN)||"{}")
}catch(e){}
const save=()=>{try{localStorage.setItem(KT,JSON.stringify(T));localStorage.setItem(KN,JSON.stringify(N))}catch(e){alert("Storage is full. Remove some pictures to save more.")}};
const key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`,tk=key(now.getFullYear(),now.getMonth(),now.getDate());
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=(v,d=0)=>(v<0?"-":v>0?"+":"")+"$"+Math.abs(v).toLocaleString("en-US",{maximumFractionDigits:d});
const short=v=>{const a=Math.abs(v),s=v<0?"-":"+";return s+"$"+(a>=1000?(a/1000).toFixed(a>=10000?0:1)+"k":Math.round(a))};
const cls=v=>v>0?"w":v<0?"l":"";
const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
function render(){
 $("#mt").textContent=MN[M]+" "+Y;
 const pre=`${Y}-${pad(M+1)}-`,mt=T.filter(t=>t.date.startsWith(pre)),by={};
 mt.forEach(t=>{(by[t.date]=by[t.date]||{p:0,n:0}).p+=t.pnl;by[t.date].n++});
 const mx=Math.max(1,...Object.values(by).map(d=>Math.abs(d.p))),tot=mt.reduce((a,t)=>a+t.pnl,0);
 $("#msum").innerHTML=`<span class="${cls(tot)}">${money(tot)}</span> <span class="mu" style="font-weight:400;font-size:12px">this month</span>`;
 const off=(new Date(Y,M,1).getDay()+6)%7,dim=new Date(Y,M+1,0).getDate(),wks=Math.ceil((off+dim)/7);
 let h=["Mon","Tue","Wed","Thu","Fri","Sat","Sun","Week"].map(x=>`<div class="dh">${x}</div>`).join("");
 for(let w=0;w<wks;w++){let wp=0,wn=0;
  for(let i=0;i<7;i++){const d=w*7+i-off+1;
   if(d<1||d>dim){h+='<div class="day out"></div>';continue}
   const k=key(Y,M,d),x=by[k];if(x){wp+=x.p;wn+=x.n}
   const c=["day",x?(x.p>=0?"win":"loss"):"",k==sel?"sel":"",k==tk?"today":""].join(" ");
   h+=`<div class="${c}" data-d="${k}" style="--a:${x?Math.min(1,Math.abs(x.p)/mx):0}"><span class="n">${d}</span>${x?`<div><div class="p ${cls(x.p)}">${short(x.p)}</div><div class="c">${x.n} trade${x.n>1?"s":""}</div></div>`:""}</div>`}
  h+=`<div class="wk"><span class="n">Week ${w+1}</span>${wn?`<div><div class="p ${cls(wp)}">${short(wp)}</div><div class="c">${wn} trade${wn>1?"s":""}</div></div>`:'<div class="c">–</div>'}</div>`}
 $("#cal").innerHTML=h;
 const wn=mt.filter(t=>t.pnl>0),ls=mt.filter(t=>t.pnl<0),gw=wn.reduce((a,t)=>a+t.pnl,0),gl=-ls.reduce((a,t)=>a+t.pnl,0);
 const days=Object.entries(by).sort((a,b)=>b[1].p-a[1].p),best=days[0],S=(l,v,c="")=>`<div class="stat"><span>${l}</span><b class="${c}">${v}</b></div>`;
 $("#stats").innerHTML=S("Month P&amp;L",money(tot),cls(tot))+S("Win rate",mt.length?Math.round(wn.length/mt.length*100)+"%":"–")+S("Profit factor",gl?(gw/gl).toFixed(2):mt.length?"∞":"–")+S("Avg win / loss",mt.length?`<span class="w">${money(wn.length?gw/wn.length:0)}</span> <span class="l" style="font-size:14px">${money(ls.length?-gl/ls.length:0)}</span>`:"–")+S("Best day",best&&best[1].p>0?money(best[1].p):"–","w")+S("Trades",mt.length);
 day();eq()}
function day(){const k=sel;if(!k){$("#dp").innerHTML='<div class="empty">Click a day on the calendar to see its trades and write your daily reflection.</div>';return}
 const L=T.filter(t=>t.date==k).sort((a,b)=>(a.time||"").localeCompare(b.time||"")),s=L.reduce((a,t)=>a+t.pnl,0);
 $("#dp").innerHTML=`<div class="hd"><h3>${new Date(k+"T00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})} <span class="${cls(s)}" style="margin-left:8px">${L.length?money(s):""}</span></h3><button class="pri" id="ad">+ Add trade</button></div>`+
 (L.length?`<div class="scroll"><table class="tbl"><tr><th>Time</th><th>Symbol</th><th>Side</th><th>Entry → Exit</th><th>P&amp;L</th><th>Setup</th><th>Mood</th></tr>${L.map(t=>`<tr data-e="${t.id}" style="cursor:pointer"><td>${esc(t.time||"–")}</td><td>${esc(t.sym)}</td><td>${t.side}</td><td>${t.e??"–"} → ${t.x??"–"}</td><td class="${cls(t.pnl)}"><b>${money(t.pnl,2)}</b></td><td>${t.tag?`<span class="tag">${esc(t.tag)}</span>`:""}</td><td>${esc(t.mood)}</td></tr>${t.note?`<tr><td colspan="7" class="mu" style="font-size:12.5px">${esc(t.note)}</td></tr>`:""}${t.pics&&t.pics.length?`<tr><td colspan="7"><div class="pics" style="margin:0">${t.pics.map(p=>`<div class="th big"><img src="${p}" alt="trade picture" data-z="1"></div>`).join("")}</div></td></tr>`:""}`).join("")}</table></div>`:'<div class="empty" style="padding:10px">No trades this day.</div>')+
 `<label class="mu" style="display:block;margin:12px 0 4px;font-size:12px">Daily reflection</label><textarea id="rf" placeholder="How was your discipline today? What will you do differently tomorrow?">${esc(N[k]||"")}</textarea>`;
 $("#ad").onclick=()=>openD();$("#rf").oninput=e=>{N[k]=e.target.value;save()};
 document.querySelectorAll("[data-e]").forEach(r=>r.onclick=()=>openD(T.find(t=>t.id==r.dataset.e)));
 document.querySelectorAll("#dp img[data-z]").forEach(i=>i.onclick=()=>zoom(i.src))}
function zoom(src){const d=document.createElement("div");d.className="lb";d.innerHTML=`<img src="${src}" alt="">`;d.onclick=()=>d.remove();document.body.appendChild(d)}
function eq(){const c=$("#eq"),w=c.clientWidth,H=190,dpr=devicePixelRatio||1;c.width=w*dpr;c.height=H*dpr;const g=c.getContext("2d");g.scale(dpr,dpr);
 const S=[...T].sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));let cum=0;const E=[0,...S.map(t=>cum+=t.pnl)];
 $("#eqs").innerHTML=T.length?`<span class="${cls(cum)}">${money(cum)}</span> all time · ${T.length} trades`:"";
 if(E.length<2){g.fillStyle="#8d82aa";g.font="13px system-ui";g.textAlign="center";g.fillText("Your equity curve will appear here",w/2,H/2);return}
 const mn=Math.min(...E),mx=Math.max(...E),r=(mx-mn)||1,X=i=>8+i*(w-16)/(E.length-1),Yy=v=>H-14-(v-mn)/r*(H-28);
 g.strokeStyle="#2a1f45";g.setLineDash([4,4]);g.beginPath();g.moveTo(8,Yy(0));g.lineTo(w-8,Yy(0));g.stroke();g.setLineDash([]);
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,"rgba(139,92,246,.45)");gr.addColorStop(1,"rgba(139,92,246,0)");
 g.beginPath();E.forEach((v,i)=>i?g.lineTo(X(i),Yy(v)):g.moveTo(X(i),Yy(v)));g.lineTo(X(E.length-1),H);g.lineTo(X(0),H);g.fillStyle=gr;g.fill();
 g.beginPath();E.forEach((v,i)=>i?g.lineTo(X(i),Yy(v)):g.moveTo(X(i),Yy(v)));g.strokeStyle="#c084fc";g.lineWidth=2.2;g.lineJoin="round";g.shadowColor="#8b5cf6";g.shadowBlur=12;g.stroke()}
/* ---- pictures ---- */
function rp(){$("#pv2").innerHTML=pics.map((p,i)=>`<div class="th"><img src="${p}" alt="picture"><button type="button" data-r="${i}" title="Remove">✕</button></div>`).join("");
 document.querySelectorAll("#pv2 [data-r]").forEach(b=>b.onclick=()=>{pics.splice(+b.dataset.r,1);rp()})}
function shrink(file){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const m=1000,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};im.onerror=()=>res(null);im.src=fr.result};fr.onerror=()=>res(null);fr.readAsDataURL(file)})}
$("#fpic").onchange=async e=>{for(const f of e.target.files){const d=await shrink(f);if(d)pics.push(d)}e.target.value="";rp()};
function openD(t){eid=t?t.id:null;manual=!!t;pics=t&&t.pics?[...t.pics]:[];const d=t||{date:sel||tk,time:"",sym:"USTEC.f",side:"Long",e:"",x:"",size:1,pnl:"",tag:"",mood:"Calm",note:""};
 $("#dt").textContent=t?"Edit trade":"New trade";$("#dl").style.display=t?"":"none";
 [["fd","date"],["ft","time"],["fs","sym"],["fsd","side"],["fe","e"],["fx2","x"],["fz","size"],["fp","pnl"],["fg","tag"],["fm2","mood"],["fn","note"]].forEach(([i,k])=>$("#"+i).value=d[k]??"");rp();$("#dlg").showModal()}
function auto(){if(manual)return;const e=parseFloat($("#fe").value),x=parseFloat($("#fx2").value),z=parseFloat($("#fz").value)||1;if(isNaN(e)||isNaN(x))return;$("#fp").value=+((($("#fsd").value=="Long"?1:-1)*(x-e)*z).toFixed(2))}
["fe","fx2","fz","fsd"].forEach(i=>$("#"+i).addEventListener("input",auto));$("#fp").addEventListener("input",()=>manual=true);
$("#fm").onsubmit=ev=>{const v=i=>$("#"+i).value,n=i=>v(i)===""?null:+v(i);
 const t={id:eid||Date.now()+Math.random(),date:v("fd"),time:v("ft"),sym:v("fs")||"USTEC.f",side:v("fsd"),e:n("fe"),x:n("fx2"),size:n("fz")||1,pnl:+v("fp"),tag:v("fg"),mood:v("fm2"),note:v("fn"),pics:[...pics]};
 eid?T=T.map(o=>o.id==eid?t:o):T.push(t);save();sel=t.date;const d=new Date(t.date+"T00:00");Y=d.getFullYear();M=d.getMonth();render()};
$("#x").onclick=()=>$("#dlg").close();$("#add").onclick=()=>openD();
$("#dl").onclick=()=>{T=T.filter(o=>o.id!=eid);save();$("#dlg").close();render()};
$("#cal").onclick=e=>{const d=e.target.closest("[data-d]");if(d){sel=d.dataset.d;render()}};
const go=n=>{M+=n;if(M<0){M=11;Y--}if(M>11){M=0;Y++}render()};$("#pv").onclick=()=>go(-1);$("#nx").onclick=()=>go(1);
$("#td").onclick=()=>{Y=now.getFullYear();M=now.getMonth();sel=tk;render()};
/* ---- Discord user + logout ---- */
$("#me").innerHTML=(USER.avatar?`<img src="https://cdn.discordapp.com/avatars/${USER.id}/${USER.avatar}.png?size=64" alt="">`:"")+esc(USER.name);
$("#out").onclick=()=>{localStorage.removeItem("jUser");location.reload()};
addEventListener("resize",eq);sel=tk;render();
</script>
</body></html>
